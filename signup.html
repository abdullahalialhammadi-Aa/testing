<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب — الكيف</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">الكيف<span>قهوة وشاي مختص</span></a>
      <nav class="nav" aria-label="القائمة الرئيسية">
        <a href="index.html" data-nav="home">الرئيسية</a>
        <a href="coffee.html" data-nav="coffee">قهوة</a>
        <a href="tea.html" data-nav="tea">شاي</a>
        <a href="tools.html" data-nav="tools">أدوات</a>
        <a href="offers.html" data-nav="offers">عروض</a>
        <a href="cart.html" data-nav="cart" class="cart-link">سلة<span class="cart-badge" data-cart-badge style="display:none"></span></a>
        <a href="login.html" data-nav="account">حساب</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>إنشاء حساب</h1>
      <p class="lead">حساب بسيط على جهازك فقط (تجريبي) — ثم نكمّل الطلب.</p>
      <div class="form-error" role="alert"></div>
      <form data-signup-form>
        <div class="form-group">
          <label for="name">الاسم</label>
          <input type="text" id="name" name="name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" required autocomplete="email" dir="ltr">
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" required minlength="4" autocomplete="new-password" dir="ltr">
        </div>
        <button type="submit" class="btn btn-primary btn-block">إنشاء الحساب</button>
      </form>
      <p class="form-footer">عندك حساب؟ <a href="login.html" data-auth-link>تسجيل الدخول</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="logo-sm">الكيف</p>
      <p>© ٢٠٢٦ الكيف — قهوة وشاي مختص</p>
    </div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
